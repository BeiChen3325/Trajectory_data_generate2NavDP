[paths]
scene_dir = "outputs/forth_local/navigation_scene"
output_dir = "outputs/forth_local/trajectories"

[planner]
obstacle_cost_weight = 0.8
obstacle_cost_power = 1.5
shortcut_passes = 120
smooth_samples_per_meter = 8.0
smooth_iterations = 2

[valid_region]
# Set yaml_path after drawing it with annotate-valid-region. Empty disables ROI restriction.
yaml_path = ""
robot_radius_m = 0.30
safety_margin_m = 0.10

[trajectory_batch]
count = 8
seed = 7
min_start_goal_distance_m = 3.0
min_endpoint_separation_m = 0.5
max_sampling_attempts = 200
manifest_filename = "trajectory_manifest.json"
requests = []
