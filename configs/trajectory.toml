[paths]
data_dir = "data/input"
las_filename = "try1-pointcloud-0706.las"
output_dir = "outputs/trajectory"

# These keys match MapConfig exactly.  CLI flags override them for one run.
[navigation]
axis_transform = "zup-to-yup"
floor_y_override = "auto"
roi_center_xz = [0.0, 0.0]
roi_size_xz = [12.0, 12.0]
floor_search_y_min = 0.0
floor_search_y_max = 3.0
resolution_m = 0.08
robot_radius_m = 0.25
robot_height_m = 0.8
ground_margin_m = 0.06
safety_margin_m = 0.10
ground_band_m = 0.08
min_points_per_cell = 2
min_ground_points_per_cell = 2
open_kernel_cells = 1
close_kernel_cells = 2
min_obstacle_component_cells = 8
ground_close_kernel_cells = 2
chunk_size = 1000000
max_stream_points = 0
floor_sample_limit = 1200000
floor_hist_bins = 180
floor_xy_resolution_m = 0.25
start_xz = []
goal_xz = []
min_start_goal_distance_m = 3.0
obstacle_cost_weight = 0.8
obstacle_cost_power = 1.5
random_seed = 7
shortcut_passes = 120
smooth_samples_per_meter = 8.0
