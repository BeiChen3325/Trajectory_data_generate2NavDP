[paths]
data_dir = "data/input"
ply_filename = "forth_local3DGS_yup_filtered.ply"
las_filename = "forth_local.las"
output_dir = "outputs/forth_local/render"

[camera]
calibration_file = "src/camera_resource/realsense_d435i.json"
stream = "color"
up_axis = "-y"

[runtime]
background = "black"
chunk_size = 1000000
seed = 7

[render]
require_cuda = true
