[paths]
trajectory_manifest = "outputs/forth_local/trajectories/trajectory_manifest.json"
semantic_pointcloud_dir = "outputs/forth_local/semantic_pointcloud"
semantic_pointcloud_filename = "pointcloud.ply"
semantic_pointcloud_report_filename = "pointcloud_report.json"
work_dir = "outputs/forth_local/dataset_build"
dataset_root = "data/target"

[trajectory_to_camera]
# Go2 相机高度、frame 和外参均由此资源条目提供；此处禁止重复定义 xyz/rpy。
camera_pose_resource = "src/camera_resource/camera_pose_presets.yaml#presets.current_forward"

[rendering]
camera_batch_size = 8

[dataset]
group_dir = "robotnav"
scene_dir = "forth_local-mini"
overwrite = false
