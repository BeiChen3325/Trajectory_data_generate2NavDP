[project]
name = "robotnav"
version = "0.1.0"
description = "Data engine and navigation utilities for RobotNav"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pandas",
    "pyarrow",
    "plyfile",
    "tomli>=2.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1",
    "gsplat>=1.5",
    "packaging",
]
dev = [
    "ipython",
    "pytest",
    "ruff",
    "ty",
]

[project.scripts]
env-check = "robotnav.env_check:main"
render = "robotnav.rendering.render_one_view:render_batch"
depth = "robotnav.rendering.depth_render:main"
compare = "robotnav.rendering.compare_render:main"
build-scene = "robotnav.commands.build_navigation_scene:main"
generate-trajectories = "robotnav.commands.generate_trajectories:main"
export-pointcloud = "robotnav.commands.export_semantic_pointcloud:main"
prepare-navigation-data = "robotnav.commands.prepare_navigation_data:main"
trajectory-to-camera = "robotnav.dataset.trajectory_to_camera:main"
render-trajectory = "robotnav.dataset.render_trajectory:main"
package-dataset = "robotnav.dataset.package_dataset:main"
build-dataset = "robotnav.dataset.build_dataset:main"
validate-dataset = "robotnav.dataset.validate_dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotnav"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "outputs", "data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.10"
root = ["src"]

[tool.ty.src]
include = ["src"]
exclude = ["outputs", "data", "__pycache__", "src/robotnav/rendering", "src/robotnav/env_check.py"]
